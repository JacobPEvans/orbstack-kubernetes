[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
extraPaths = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
# py314 not yet supported in ruff v0.9.0; bump to py314 once ruff adds support
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["tests"]

[tool.coverage.report]
precision = 2
fail_under = 80
