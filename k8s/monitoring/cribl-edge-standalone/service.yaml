apiVersion: v1
kind: Service
metadata:
  name: cribl-edge-standalone
  namespace: monitoring
  labels:
    app: cribl-edge-standalone
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: cribl-edge-standalone
  ports:
    - name: otel
      port: 9420
      targetPort: 9420
      protocol: TCP
    - name: ui
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: hec
      port: 8088
      targetPort: 8088
      protocol: TCP
