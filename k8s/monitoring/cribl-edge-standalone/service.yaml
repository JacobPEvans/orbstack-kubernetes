apiVersion: v1
kind: Service
metadata:
  name: cribl-edge-standalone
  namespace: monitoring
  labels:
    app: cribl-edge-standalone
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: cribl-edge-standalone
  ports:
    - name: otel
      port: 9420
      targetPort: 9420
      protocol: TCP
    - name: ui
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: otlp-grpc
      # 14317, not the OTLP-standard 4317: the gemini pack squats
      # 127.0.0.1:4317 in-pod (see inputs.yml). This service is HEADLESS
      # (clusterIP: None), so there is no kube-proxy port remapping —
      # clients resolve the pod IP and must dial the pod port directly.
      port: 14317
      targetPort: 14317
      protocol: TCP
    - name: hec
      port: 8088
      targetPort: 8088
      protocol: TCP
