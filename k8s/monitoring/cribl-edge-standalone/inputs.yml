inputs:
  in_bifrost_pod_logs:
    type: file
    disabled: false
    mode: manual
    filenames:
      - /var/log/pods/monitoring_bifrost-*/**/*.log
    # Index/sourcetype stamped at the source; the homelab Stream passes
    # events straight through to Splunk.
    metadata:
      - name: index
        value: "'llm'"
      - name: sourcetype
        value: "'bifrost'"
    sendToRoutes: false
    connections:
      - output: proxmox-stream
  in_otel:
    # OTLP from the in-cluster otel-collector (which receives host producers
    # via NodePort 30317). Replaces the retired laptop Stream's otel-in.
    # Index/sourcetype are derived from `datatype` by the force-splunk-meta
    # output pipeline on proxmox-stream.
    # Pod-side port is 14317, NOT 4317: the cc-edge-gemini-antigravity pack
    # ships a gemini-cli-otel input squatting on 127.0.0.1:4317, and Cribl's
    # conflict check is port-wide ("Source will be disabled"). The service
    # still exposes 4317 externally and maps it here.
    type: open_telemetry
    disabled: false
    port: 14317
    host: 0.0.0.0
    grpcConfig: {}
    sendToRoutes: false
    connections:
      - output: proxmox-stream
  in_hec:
    # Splunk-HEC-compatible input for host producers that POST to the
    # cluster's HEC NodePort 30088 (registered in the host's ai-stack
    # endpoint registry). Replaces the retired laptop Stream's edge-hec-in.
    type: splunk_hec
    disabled: false
    port: 8088
    host: 0.0.0.0
    splunkHecAPI: /services/collector
    tls:
      disabled: true
    requireToken: false
    sendToRoutes: false
    connections:
      - output: proxmox-stream
