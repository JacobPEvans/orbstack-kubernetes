---
# Allow OTEL collector to forward telemetry to the local Cribl Edge, which
# ships everything to the homelab Cribl Stream over S2S.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: cribl-edge-standalone
      ports:
        - port: 14317  # OTLP gRPC (pod port — netpols match post-DNAT; service maps 4317 → 14317)
          protocol: TCP
