---
# Allow Cribl Edge Standalone egress: Cribl S2S (:10300) to the homelab
# HAProxy-fronted Stream workers, and HTTPS for pack downloads from GitHub at
# startup. The S2S rule is port-only because the destination is outside the
# cluster (the homelab address never appears in this public repo; the Edge
# resolves it from CRIBL_S2S_HOST at start).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-standalone-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: cribl-edge-standalone
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 10300  # Cribl S2S to the homelab Stream (via HAProxy)
          protocol: TCP
    - ports:
        - port: 443  # HTTPS for pack download from GitHub
          protocol: TCP
