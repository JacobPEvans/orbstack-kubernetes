---
# Browser-accessible XFCE desktop with Firefox + OpenWebStart, used to reach
# the Dell PowerEdge R410 iDRAC 6 web UI and Java JNLP virtual console.
#
# iDRAC 6 requires legacy TLS ciphers + a Java JNLP runtime that modern macOS
# browsers no longer support. Rather than installing legacy Java on the host,
# everything legacy lives inside this disposable container.
#
# Boot once (first run installs OpenWebStart via /custom-cont-init.d):
#   cp .env.example .env && $EDITOR .env   # set IDRAC_URL
#   docker compose up -d
#   open http://localhost:3000
#
# Tear down:
#   docker compose down       # keep config volume
#   docker compose down -v    # nuke everything (re-runs init on next up)
services:
  webtop:
    container_name: idrac-webtop
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    # iDRAC 6's viewer.jnlp ships only x86_64 native libs (USB/HID/KVM) and
    # OpenWebStart auto-downloads an x86_64 JRE to match the JNLP request.
    # Pin the whole container to amd64 so Apple Silicon hosts run it under
    # Rosetta — everything (webtop, JRE, JNLP native libs) is amd64 end-to-end.
    # On amd64 hosts this line is a no-op.
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Localhost-only by default. The webtop has no auth out of the box, so
      # binding 0.0.0.0:3000 would let anyone on the LAN reach the desktop —
      # and the cached iDRAC session inside it. Drop the 127.0.0.1: prefix
      # only if you've added a reverse proxy with auth in front.
      - "127.0.0.1:3000:3000"
    environment:
      PUID: ${UID:-1000}
      PGID: ${GID:-1000}
      IDRAC_URL: ${IDRAC_URL:?IDRAC_URL must be set in .env (see .env.example)}
    volumes:
      # Persistent desktop state: Firefox profile, installed packages, bookmark.
      - idrac-webtop-config:/config
      # linuxserver.io init hook directory. Scripts here run as root on every
      # container start, before s6 services come up. The install script is
      # idempotent (sentinel-guarded) so restarts are cheap.
      - ./init:/custom-cont-init.d:ro
      # Payload files (idrac-launch wrapper + .desktop) that the init hook
      # installs into the container. Kept out of ./init/ because linuxserver's
      # runner would otherwise exec idrac-launch.sh as a boot hook.
      - ./payload:/opt/idrac-payload:ro

volumes:
  idrac-webtop-config:
